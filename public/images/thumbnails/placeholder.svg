<svg width="320" height="180" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#0f1923"/>
  
  <!-- Padrão do fundo -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" stroke="#1a2e4a" stroke-width="1" fill="none"/>
    </pattern>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Degradê do fundo -->
  <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#ff4b2b;stop-opacity:0.15" />
    <stop offset="100%" style="stop-color:#ff416c;stop-opacity:0.15" />
  </linearGradient>
  <rect width="100%" height="100%" fill="url(#grad)"/>
  
  <!-- Ícone de reprodução -->
  <circle cx="160" cy="90" r="40" fill="#1a2e4a"/>
  <polygon points="145,70 145,110 185,90" fill="#ffffff"/>
  
  <!-- Texto -->
  <text x="160" y="150" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">YgorX Free Fire Gameplay</text>
</svg> 